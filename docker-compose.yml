services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: automotive-advisor-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gemini-1.5-pro}
      - DATABASE_PATH=/app/data/automotive_advisor.db
      - ENABLE_CLOUD_TRACE=${ENABLE_CLOUD_TRACE:-false}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - CORS_ORIGIN=*
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: automotive-advisor-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: automotive-advisor-network
